<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex" />
    <title>Welcome — Tally</title>
    <!--
      The registration form a family fills in on their own phone, reached by
      scanning the QR on the lobby kiosk.

      Its own page for the same reason the kiosk has one: nothing here needs a
      router, a service worker, or Firestore — the whole app is one form and one
      callable. Unlike the kiosk it is *light*, because it is read on a phone in
      a bright foyer rather than on a fixed screen on a shelf.

      `noindex` matters more here than anywhere else in Tally. This is the only
      unauthenticated write surface the product has, and it is meant to be
      reached from a code on a screen somebody is standing in front of — not
      from a search result. See src/welcome/main.tsx.
    -->
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/welcome/main.tsx"></script>
  </body>
</html>
