<!doctype html>
<!--
  `data-theme="light"` is load-bearing, not a preference.

  Nothing on this page runs ThemeProvider — it is one form and one callable, no
  router and no context — so without the attribute there is no `data-theme` at
  all and `:root`'s default applies, which is the dark ramp. The kiosk pins
  `dark` one line below its own doctype for the mirror-image reason.

  Read `src/index.css` before changing any ink class here: the ramp *inverts*
  between the two themes rather than sliding along one axis. `ink-50` is the
  most prominent ink in both and `ink-950` is the page in both, so a heading is
  `text-ink-50` whichever way this attribute goes. Writing `text-ink-900` for
  one — as this form originally did — resolves to `#ffffff` under light and put
  the "Welcome!" heading and every fieldset legend on the wrong side of the
  page.
-->
<html lang="en" class="h-full" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The page's own ground, so the phone's chrome does not frame a light
         form in the dark app's navy. -->
    <meta name="theme-color" content="#f1f5f9" />
    <meta name="robots" content="noindex" />
    <title>Welcome — Tally</title>
    <!--
      The registration form a family fills in on their own phone, reached by
      scanning the QR on the lobby kiosk.

      Its own page for the same reason the kiosk has one: nothing here needs a
      router, a service worker, or Firestore — the whole app is one form and one
      callable. Unlike the kiosk it is *light*, because it is read on a phone in
      a bright foyer rather than on a fixed screen on a shelf.

      `noindex` matters more here than anywhere else in Tally. This is the only
      unauthenticated write surface the product has, and it is meant to be
      reached from a code on a screen somebody is standing in front of — not
      from a search result. See src/welcome/main.tsx.
    -->
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/welcome/main.tsx"></script>
  </body>
</html>
