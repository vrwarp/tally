<!doctype html>
<!--
  The kiosk's home screen, live, for the walkthrough of the lobby-languages
  change. Same root as the other kiosk harnesses: `data-theme="dark"` and a
  full-height root, because a lobby tablet is not a page that ends where its
  content does.
-->
<html lang="en" class="h-full" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Tally kiosk — live demo</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
