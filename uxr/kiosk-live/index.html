<!doctype html>
<!--
  The kiosk, mounted for the critique loop.

  `data-theme="dark"` and `class="h-full"` are what `kiosk.html` sets, and the
  screens under review are laid out against a full-height root — a page that
  did not pin both would render a kiosk that ended where its content did, which
  is not a shape any lobby tablet takes.
-->
<html lang="en" class="h-full" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Kiosk — UXR</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
