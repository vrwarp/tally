<!doctype html>
<!--
  The kiosk screen, mounted for the critique loop.

  `data-theme="dark"` is what a signed-in phone in a dim hallway resolves to and
  what every other frame in this loop was shot in; the app's `ThemeProvider`
  writes the same attribute onto `<html>` once it has read the local choice, and
  nothing here reads that choice.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Kiosk — UXR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
