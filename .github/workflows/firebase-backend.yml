# Cloud Functions, Firestore security rules and Firestore indexes.
#
# Hosting lives in the two firebase-hosting-* workflows. It is separate on
# purpose: Hosting is a static bundle that can be rolled back by redeploying,
# whereas these three change what the backend *does* and who can read a roster
# of minors' data. They therefore run behind a stricter gate — see
# docs/ci.md#what-ci-does-not-do — and use their own, more privileged key.
name: Firebase backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Every firebase invocation is pinned to the project explicitly rather than
  # relying on .firebaserc, so a change there cannot silently retarget a deploy.
  FIREBASE_PROJECT: tally-76406

jobs:
  # On a pull request, prove the deploy *would* work without changing anything:
  # `--dry-run` builds the functions and validates the rules and indexes against
  # the real project, which catches a malformed ruleset or a functions build
  # break before it is merged rather than after.
  validate:
    name: Validate (dry run)
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm --prefix functions ci

      # Credential-free, so it runs on every pull request regardless of secrets.
      - name: The functions must compile
        run: npm run functions:build

      # A pull request should not go red merely because the deploy key has not
      # been set up yet — that says nothing about the change being reviewed. The
      # dry run is skipped with a notice instead, and starts running by itself
      # once the secret exists. Skipping it loses less than it appears to: the
      # functions build above and the emulator-based rules suite in ci.yml gate
      # every pull request without needing any credential at all.
      #
      # The deploy job deliberately does *not* do this. A deploy that quietly
      # skipped itself because a key was missing would be a silent no-op, so it
      # is left to fail loudly.
      - name: Are the backend secrets configured?
        id: creds
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY_BACKEND }}
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          if [ -n "$KEY" ] && [ -n "$FUNCTIONS_ENV" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::FIREBASE_SERVICE_ACCOUNT_TALLY_BACKEND or FUNCTIONS_ENV is not set, so the deploy dry run was skipped. See README.md#repository-secrets.'
          fi

      # The CLI resolves the functions' defineString params from
      # .env.<project> before running anything, and stops to ask when the file
      # is missing — see the note in functions/.env.demo-tally. `.env.*` is
      # gitignored at every level, so this file cannot be committed by accident.
      - name: Write the Planning Center settings
        if: steps.creds.outputs.present == 'true'
        env:
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: printf '%s\n' "$FUNCTIONS_ENV" > "functions/.env.$FIREBASE_PROJECT"

      - uses: google-github-actions/auth@v3
        if: steps.creds.outputs.present == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY_BACKEND }}

      # Note that a dry run is not entirely free of side effects: the CLI may
      # enable required APIs on the target project. It never deploys code or
      # rules, which is the property being relied on here.
      - name: Validate functions, rules and indexes without deploying
        if: steps.creds.outputs.present == 'true'
        run: >-
          npx firebase deploy
          --only functions,firestore:rules,firestore:indexes
          --dry-run --non-interactive
          --project "$FIREBASE_PROJECT"

  # On merge, deploy for real — but only after the suites that describe the
  # things being deployed have passed *in this job*. CI runs in a separate
  # workflow that this one cannot depend on, so re-running them here is what
  # makes "rules are never deployed while their tests are failing" true rather
  # than merely likely.
  deploy:
    name: Deploy functions, rules and indexes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Add required reviewers to this environment to make a backend deploy need a
    # human approval; without protection rules it simply deploys on merge.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # The Firestore emulator the rules suite runs against is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the emulator jars
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - run: npm ci
      - run: npm --prefix functions ci

      - name: Security rules must pass before they ship
        run: npm run test:rules
      - name: Cloud Functions tests must pass before they ship
        run: npm run test:functions

      # Loud on purpose, unlike the pull-request job: deploying without the
      # Planning Center settings would either stop at a prompt nobody can answer
      # or quietly ship the empty defaults from src/config.ts.
      - name: Write the Planning Center settings
        env:
          FUNCTIONS_ENV: ${{ secrets.FUNCTIONS_ENV }}
        run: |
          if [ -z "$FUNCTIONS_ENV" ]; then
            echo "::error::FUNCTIONS_ENV is not set. See README.md#repository-secrets."
            exit 1
          fi
          printf '%s\n' "$FUNCTIONS_ENV" > "functions/.env.$FIREBASE_PROJECT"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY_BACKEND }}

      # No --force: a function that has disappeared from the source is left
      # running rather than deleted by a robot. Removing one is a deliberate
      # `npx firebase functions:delete` by a human.
      - name: Deploy
        run: >-
          npx firebase deploy
          --only functions,firestore:rules,firestore:indexes
          --non-interactive
          --project "$FIREBASE_PROJECT"

      # A callable whose Cloud Run service does not allow unauthenticated
      # invocations rejects the CORS preflight — which carries no Authorization
      # header — before the container sees it, and the browser reports a missing
      # Access-Control-Allow-Origin header on a function whose code is fine. The
      # CLI sets that binding when it *creates* a function and never re-checks
      # it, so a binding removed afterwards survives every later deploy. This
      # asserts it, and does not weaken authentication: the ID token is still
      # verified inside the call. See
      # docs/deployment-setup.md#callable-functions-must-allow-unauthenticated-invocations.
      - name: Callable functions must answer unauthenticated preflights
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY_BACKEND }}
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT }}
        run: npm run functions:invokers
