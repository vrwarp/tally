name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build_and_preview:
    name: Build & deploy preview
    # Forked PRs cannot see repository secrets, so a preview cannot be built
    # for them; only PRs from branches within this repository run here.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          # Passed so the preview build matches the live one. It has no effect
          # here: a preview channel's URL is generated per-deploy and so is
          # never on the list, which is exactly the fallback being previewed.
          VITE_AUTH_DOMAINS: ${{ secrets.VITE_AUTH_DOMAINS }}
      # As in firebase-backend.yml: a pull request should not go red merely
      # because the deploy key has not been created yet, which says nothing
      # about the change being reviewed. The build above still runs either way,
      # so a change that cannot compile is still caught. The merge workflow is
      # deliberately strict — a live deploy that skipped itself over a missing
      # key would be a silent no-op.
      - name: Is the Hosting key configured?
        id: creds
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::FIREBASE_SERVICE_ACCOUNT_TALLY is not set, so no preview channel was deployed. See README.md#repository-secrets.'
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: deploy
        if: steps.creds.outputs.present == 'true'
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY }}'
          projectId: tally-76406
          # A site holds a limited number of preview channels at once, and the
          # default week-long life meant every pull request opened in a week was
          # still holding one — until a deploy came back
          # `429 RESOURCE_EXHAUSTED: channel quota reached` and no pull request
          # could be previewed at all. Half a day is longer than a review of one
          # of these takes, and a channel outlived by its pull request is
          # re-made by the next push to it.
          expires: 12h

      # Firebase Auth refuses to start a sign-in from a host that is not on the
      # project's authorized domains list, and a preview channel's host is
      # generated per-channel, so it never is. Without this the preview comes up
      # showing `auth/unauthorized-domain` and nobody can get past the login
      # screen — which is most of what there is to review.
      #
      # The CLI is supposed to do this itself and quietly does not; the script
      # explains why, and does it in a way that fails visibly instead. It is
      # deliberately allowed to fail the job: a green deploy of a preview that
      # cannot be signed into is the exact silence this replaces.
      - name: Authorize the preview URL for sign-in
        if: steps.deploy.outputs.details_url != ''
        run: npx tsx scripts/authorized-domains.ts add "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
          FIREBASE_PROJECT_ID: tally-76406
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY }}
