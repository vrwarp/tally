name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          # Domains serving Tally's own /__/auth handler, so the installed app
          # can sign in — see docs/deployment-setup.md#the-sign-in-domain.
          # Unset is fine: sign-in falls back to the console's authDomain.
          VITE_AUTH_DOMAINS: ${{ secrets.VITE_AUTH_DOMAINS }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TALLY }}'
          channelId: live
          projectId: tally-76406
